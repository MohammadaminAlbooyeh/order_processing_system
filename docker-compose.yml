# docker-compose.yml
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis (Cache + Message Queue)
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Order API Service (Java)
  order-api:
    build:
      context: .
      dockerfile: services/order-api-java/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://ecommerce:password@postgres:5432/orders
      REDIS_URL: redis://redis:6379
      SECRET_KEY: change-me-in-production
      JAEGER_ENABLED: "true"
      JAEGER_HOST: jaeger
      JAEGER_PORT: "6831"
    depends_on:
      - postgres
      - redis
      - jaeger

  # User Service (Java)
  user-service:
    build:
      context: .
      dockerfile: services/user-service-java/Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://ecommerce:password@postgres:5432/orders
      SECRET_KEY: change-me-in-production
      JAEGER_ENABLED: "true"
      JAEGER_HOST: jaeger
      JAEGER_PORT: "6831"
    depends_on:
      - postgres
      - jaeger

  # Worker Service (Java)
  worker:
    build:
      context: .
      dockerfile: services/worker-service-java/Dockerfile
    ports:
      - "8004:8000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379
      DATABASE_URL: postgresql://ecommerce:password@postgres:5432/orders
      JAEGER_ENABLED: "true"
      JAEGER_HOST: jaeger
      JAEGER_PORT: "6831"
    depends_on:
      - redis
      - postgres
      - jaeger

  # Notification Service (Java)
  notification:
    build:
      context: .
      dockerfile: services/notification-service-java/Dockerfile
    ports:
      - "8003:8000"
    environment:
      REDIS_URL: redis://redis:6379
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: 587
      JAEGER_ENABLED: "true"
      JAEGER_HOST: jaeger
      JAEGER_PORT: "6831"
    depends_on:
      - redis
      - jaeger

  # Monitoring: Prometheus
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  # Monitoring: Grafana
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  # Monitoring: Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one
    ports:
      - "16686:16686"

  # Frontend (React)
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - order-api
      - user-service

volumes:
  postgres_data:
