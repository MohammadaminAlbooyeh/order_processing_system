# docker-compose.yml

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis (Cache + Message Queue)
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Order API Service (Java)
  order-api:
    build:
      context: .
      dockerfile: services/order-api-java/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://ecommerce:password@postgres:5432/orders
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # User Service (Java)
  user-service:
    build:
      context: .
      dockerfile: services/user-service-java/Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://ecommerce:password@postgres:5432/orders
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-production}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Worker Service (Java)
  worker:
    build:
      context: .
      dockerfile: services/worker-service-java/Dockerfile
    ports:
      - "8004:8000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379
      DATABASE_URL: postgresql://ecommerce:password@postgres:5432/orders
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  # Notification Service (Java)
  notification:
    build:
      context: .
      dockerfile: services/notification-service-java/Dockerfile
    ports:
      - "8003:8000"
    environment:
      REDIS_URL: redis://redis:6379
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  # Monitoring: Prometheus
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # Monitoring: Grafana
  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # Monitoring: Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped

  # Frontend (React)
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - order-api
      - user-service
    restart: unless-stopped

volumes:
  postgres_data:
