server:
  port: 8000

spring:
  application:
    name: worker-service
  data:
    redis:
      url: ${CELERY_BROKER_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://jaeger:4318/v1/traces}

logging:
  level:
    root: INFO
    com.ecommerce.worker: INFO
