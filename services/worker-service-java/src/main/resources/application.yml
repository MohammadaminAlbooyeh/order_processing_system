server:
  port: 8000

spring:
  application:
    name: worker-service
  data:
    redis:
      url: ${CELERY_BROKER_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.ecommerce.worker: INFO
