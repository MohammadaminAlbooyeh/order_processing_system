global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "order-api"
    static_configs:
      - targets: ["order-api:8000"]
    metrics_path: /actuator/prometheus

  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:8000"]
    metrics_path: /actuator/prometheus

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification:8000"]
    metrics_path: /actuator/prometheus

  - job_name: "worker-service"
    static_configs:
      - targets: ["worker:8000"]
    metrics_path: /actuator/prometheus