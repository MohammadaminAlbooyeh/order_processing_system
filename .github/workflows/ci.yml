name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  java-tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-api-java
          - user-service-java
          - worker-service-java
          - notification-service-java
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: mvn -B test

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: java-tests
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-api-java
          - user-service-java
          - worker-service-java
          - notification-service-java
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t ${{ matrix.service }}:ci .

  integration:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: java-tests
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build postgres redis jaeger order-api user-service worker notification

      - name: Run smoke test
        run: ./scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
